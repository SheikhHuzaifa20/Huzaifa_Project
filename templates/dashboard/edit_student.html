{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block title %}Edit Student | EduPredict{% endblock %}

{% block content %}
<div class="row justify-content-center animate-fade-in pt-4">
    <div class="col-md-8">
        <div class="glass-card p-4 p-md-5">
            <div class="d-flex align-items-center mb-4">
                <div class="stat-icon bg-secondary bg-opacity-10 text-secondary me-3">
                    <i class="fas fa-user-edit"></i>
                </div>
                <h3 class="fw-bold mb-0">Edit Student: {{ student.user.get_full_name }}</h3>
            </div>
            
            <form method="post">
                {% csrf_token %}
                {% bootstrap_form form %}
                
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg shadow">Update Record</button>
                    <a href="{% url 'student_list' %}" class="btn btn-light">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
