{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block title %}Add New Course | EduPredict{% endblock %}

{% block content %}
<div class="row justify-content-center animate-fade-in pt-4">
    <div class="col-md-7">
        <div class="glass-card p-4 p-md-5">
            <div class="d-flex align-items-center mb-4">
                <div class="stat-icon bg-primary bg-opacity-10 text-primary me-3">
                    <i class="fas fa-book-open"></i>
                </div>
                <h3 class="fw-bold mb-0">Create New Course</h3>
            </div>
            
            <form method="post">
                {% csrf_token %}
                {% bootstrap_form form %}
                
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg shadow">Save Course</button>
                    <a href="{% url 'course_list' %}" class="btn btn-light">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
