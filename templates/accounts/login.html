{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block title %}Login | EduPredict{% endblock %}

{% block content %}
<div class="row justify-content-center animate-fade-in pt-5">
    <div class="col-md-5">
        <div class="glass-card p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="fas fa-lock text-primary fa-3x mb-3"></i>
                <h2 class="fw-bold">Sign In</h2>
                <p class="text-secondary">Welcome back to EduPredict</p>
            </div>
            
            <form method="post">
                {% csrf_token %}
                {% bootstrap_form form %}
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg shadow">Login</button>
                </div>
            </form>
            
            <div class="text-center mt-4">
                <p class="text-secondary">Don't have an account? <a href="{% url 'register' %}" class="text-primary fw-medium text-decoration-none">Register here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
